<script>
/* AUTO-ACTUALIZACIÓN AUTOMÁTICA
   VERSION_CARGADA no se toca. Para publicar: cambia version.json Y sube los HTML.

   Comportamiento: si no hay datos sin guardar, la página se actualiza SOLA,
   en silencio. Solo cuando el usuario está capturando algo se le pregunta,
   para no borrarle el trabajo a medias. */
(function(){
  const VERSION_CARGADA = "2026.08.18-2";
  const INTERVALO_MS = 60000;
  const CLAVE_INTENTO = "sky_intento_actualizar";
  let barra = null, versionPendiente = null;

  // ¿Hay trabajo sin guardar? Recargar en ese momento borraría la captura.
  function hayTrabajoEnCurso(){
    // Modal o panel abierto
    if(document.querySelector(".overlay.show, .modal.show")) return true;
    // Algún campo con contenido escrito por el usuario
    const campos = document.querySelectorAll("input, textarea, select");
    for(const c of campos){
      if(c.type === "hidden" || c.disabled || c.readOnly) continue;
      if(c.offsetParent === null) continue;              // no visible
      if(c.id && /^(srch|global-search|filtro|f-)/.test(c.id)) continue;  // búsquedas y filtros no cuentan
      if(c.tagName === "SELECT"){ if(c.selectedIndex > 0) return true; continue; }
      if(c.type === "file"){ if(c.files && c.files.length) return true; continue; }
      if(c.type === "checkbox" || c.type === "radio"){ if(c.checked) return true; continue; }
      if(String(c.value || "").trim() !== "") return true;
    }
    return false;
  }

  function aplicarActualizacion(versionNueva){
    try{ sessionStorage.setItem(CLAVE_INTENTO, versionNueva); }catch(e){}
    const recargar = () => location.replace(location.pathname + "?v=" + Date.now() + location.hash);
    if(window.caches){
      caches.keys().then(ll => Promise.all(ll.map(k => caches.delete(k)))).then(recargar).catch(recargar);
    }else{
      recargar();
    }
  }

  async function revisarVersion(){
    if(barra) return;
    try{
      const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
      if(!r.ok) return;
      const data = await r.json();
      if(!data.version || data.version === VERSION_CARGADA) return;

      // Si ya intentamos llegar a esta versión y el archivo sigue siendo el
      // viejo, el despliegue está incompleto: se subió version.json pero no
      // los HTML. Reintentar sería un bucle de recargas.
      let yaIntentado = null;
      try{ yaIntentado = sessionStorage.getItem(CLAVE_INTENTO); }catch(e){}
      if(yaIntentado === data.version){
        console.warn("[SkySense] version.json indica " + data.version +
          " pero este archivo sigue en " + VERSION_CARGADA +
          ". Falta publicar los HTML actualizados.");
        return;
      }

      versionPendiente = data.version;

      if(!hayTrabajoEnCurso()){
        aplicarActualizacion(data.version);   // silencioso
        return;
      }
      mostrarAviso();                          // hay captura en curso: preguntar
    }catch(e){}
  }

  function mostrarAviso(){
    barra = document.createElement("div");
    barra.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:99999;"+
      "display:flex;align-items:center;gap:16px;padding:13px 18px;border-radius:12px;background:#1B4B8A;color:#fff;"+
      "box-shadow:0 8px 28px rgba(0,0,0,.35);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;"+
      "max-width:calc(100vw - 32px)";
    barra.innerHTML =
      '<strong>Nueva versión disponible</strong>'+
      '<button id="btn-actualizar-ver" style="background:#fff;color:#1B4B8A;border:0;padding:8px 16px;border-radius:8px;'+
      'font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">Actualizar</button>'+
      '<button id="btn-luego-ver" style="background:transparent;color:rgba(255,255,255,.65);border:0;font-size:11px;'+
      'cursor:pointer;white-space:nowrap">Luego</button>';
    document.body.appendChild(barra);

    document.getElementById("btn-actualizar-ver").onclick = function(){
      this.textContent = "Actualizando…";
      this.disabled = true;
      aplicarActualizacion(versionPendiente);
    };
    document.getElementById("btn-luego-ver").onclick = function(){
      barra.remove(); barra = null;
      setTimeout(revisarVersion, 300000);
    };
  }

  revisarVersion();
  setInterval(revisarVersion, INTERVALO_MS);
  // Al volver a la pestaña suele ser el mejor momento: nada a medio escribir
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) revisarVersion(); });
})();
</script>
