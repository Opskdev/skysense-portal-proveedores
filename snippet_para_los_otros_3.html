<script>
/* AUTO-ACTUALIZACIÓN — no modificar VERSION_CARGADA en cada deploy.
   Para publicar una versión nueva: cambia SOLO el número en version.json */
(function(){
  const VERSION_CARGADA = "2026.08.18-1";
  const INTERVALO_MS = 120000;
  let avisoMostrado = false;

  async function revisarVersion(){
    if(avisoMostrado) return;
    try{
      const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
      if(!r.ok) return;
      const data = await r.json();
      if(data.version && data.version !== VERSION_CARGADA) mostrarAviso(data.notas || "");
    }catch(e){}
  }

  function mostrarAviso(notas){
    avisoMostrado = true;
    const barra = document.createElement("div");
    barra.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:99999;"+
      "display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:12px;background:#1B4B8A;color:#fff;"+
      "box-shadow:0 8px 28px rgba(0,0,0,.35);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;"+
      "max-width:calc(100vw - 32px)";
    barra.innerHTML =
      '<div style="line-height:1.35"><strong>Hay una versión nueva del portal</strong>'+
      (notas?'<div style="font-size:11px;opacity:.8;margin-top:2px">'+notas+'</div>':'')+'</div>'+
      '<button id="btn-actualizar-ver" style="background:#fff;color:#1B4B8A;border:0;padding:8px 15px;border-radius:8px;'+
      'font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">Actualizar</button>'+
      '<button id="btn-luego-ver" style="background:transparent;color:rgba(255,255,255,.65);border:0;font-size:11px;'+
      'cursor:pointer;white-space:nowrap">Luego</button>';
    document.body.appendChild(barra);
    document.getElementById("btn-actualizar-ver").onclick = function(){
      location.replace(location.pathname + "?v=" + Date.now() + location.hash);
    };
    document.getElementById("btn-luego-ver").onclick = function(){
      barra.remove();
      setTimeout(function(){ avisoMostrado = false; revisarVersion(); }, 600000);
    };
  }

  revisarVersion();
  setInterval(revisarVersion, INTERVALO_MS);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) revisarVersion(); });
})();
</script>
